<!DOCTYPE html>
<html lang="uk" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>ЧЕБУROOM Запоріжжя — Крафтовий street food | Справжні чебуреки та янтики</title>
    <meta name="description" content="ЧЕБУROOM у Запоріжжі (@cheburoom.zp): авторські гарячі чебуреки з пухирчастим тістом та кримські янтики без олії. З-під ножа за 7-12 хвилин. Телефон: +380 (95) 199 15 99" />
    <meta name="theme-color" content="#101012" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ЧЕБУROOM — Справжні чебуреки та янтики в Запоріжжі" />
    <meta property="og:description" content="Пухирчасте тісто щоденного замісу, добірне м'ясо з гарячим бульйоном та янтики на сухій пательні без олії." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1541745537411-b8046dc6d66c?auto=format&fit=crop&w=1200&q=80" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cheburoom_theme');
          var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
